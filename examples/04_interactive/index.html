<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wash API - Interactive Shader</title>
<style>
  body { background: #111; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
  canvas { border: 1px solid #333; margin-top: 20px; cursor: crosshair; }
  p { max-width: 600px; margin: 0 auto; color: #aaa; }
</style>
</head>
<body>
  <h1>Example 4: Interactive Julia Fractal</h1>
  <p>Move your mouse over the canvas to change the fractal parameters in real-time. Uniforms (time, mouse coordinates) are passed directly as function arguments!</p>
  <canvas id="canvas" width="800" height="600"></canvas>

<script type="module">
import { wash_memory, wash_load, wash_run } from "../../wash.js";

const canvas = document.querySelector("#canvas");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;
const SIZE = W * H * 4;

const mem = wash_memory(SIZE);
const shader = await wash_load("./main.wasm", mem);

const image = ctx.createImageData(W, H);

let mouseX = 0.5;
let mouseY = 0.5;

canvas.addEventListener("mousemove", (e) => {
    const rect = canvas.getBoundingClientRect();
    mouseX = (e.clientX - rect.left) / rect.width;
    mouseY = (e.clientY - rect.top) / rect.height;
});

function renderFrame(time) {
    // Crunch numbers passing typed parameters directly: (pixels, W, H, time, mouseX, mouseY)
    wash_run(shader, mem, W, H, time, mouseX, mouseY);

    image.data.set(mem.u8);
    ctx.putImageData(image, 0, 0);

    requestAnimationFrame(renderFrame);
}

// Start the loop
requestAnimationFrame(renderFrame);
</script>
</body>
</html>
