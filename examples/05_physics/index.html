<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wash API - Particle Physics</title>
<style>
  body { background: #111; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
  canvas { border: 1px solid #333; margin-top: 20px; cursor: none; }
  p { max-width: 600px; margin: 0 auto; color: #aaa; }
</style>
</head>
<body>
  <h1>Example 5: Particle Physics Simulation</h1>
  <p>This demonstrates that Wash is a general compute engine. The WASM maintains internal state (position and velocity of 20,000 particles). Move your mouse to attract them!</p>
  <canvas id="canvas" width="800" height="600"></canvas>

<script type="module">
import { wash_memory, wash_load, wash_run } from "../../wash.js";

const canvas = document.querySelector("#canvas");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;

const NUM_PARTICLES = 20000;
const SIZE = (W * H * 4) + (NUM_PARTICLES * 28);

const mem = wash_memory(SIZE);
const shader = await wash_load("./main.wasm", mem);

const image = ctx.createImageData(W, H);

let mouseX = 0.5;
let mouseY = 0.5;

canvas.addEventListener("mousemove", (e) => {
    const rect = canvas.getBoundingClientRect();
    mouseX = (e.clientX - rect.left) / rect.width;
    mouseY = (e.clientY - rect.top) / rect.height;
});

function renderFrame() {
    // Pass typed parameters directly: (pixels, W, H, mouseX, mouseY, NUM_PARTICLES)
    wash_run(shader, mem, W, H, mouseX, mouseY, NUM_PARTICLES);

    image.data.set(mem.rawU8(0, W * H * 4));
    ctx.putImageData(image, 0, 0);

    requestAnimationFrame(renderFrame);
}

requestAnimationFrame(renderFrame);
</script>
</body>
</html>
