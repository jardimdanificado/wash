<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wash API - Parallel Multi-Threaded Path Tracer</title>
<style>
  body {
    background: #121212;
    color: #eee;
    font-family: system-ui, -apple-system, sans-serif;
    text-align: center;
    margin: 0;
    padding: 20px;
  }
  h1 { margin-bottom: 6px; }
  p { max-width: 700px; margin: 0 auto 15px auto; color: #aaa; font-size: 0.95em; line-height: 1.5; }
  .controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .card {
    background: #1e1e1e;
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid #333;
    font-size: 0.9em;
  }
  select, button {
    background: #2a2a2a;
    color: #fff;
    border: 1px solid #555;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 500;
  }
  select:hover, button:hover { background: #3a3a3a; }
  canvas {
    border: 1px solid #444;
    border-radius: 6px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    cursor: grab;
    background: #000;
  }
  canvas:active { cursor: grabbing; }
  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 10px;
    font-family: monospace;
    font-size: 1.05em;
  }
  .stat-val { color: #66b3ff; font-weight: bold; }
  .speedup { color: #4ade80; font-weight: bold; }
  .badge { background: #005fb8; color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.8em; }
</style>
</head>
<body>
  <h1>Example 8: Parallel Monte Carlo Path Tracer <span class="badge">wash_worker</span></h1>
  <p>
    Distributes Monte Carlo ray tracing across CPU threads using typed function arguments with <b>wash_worker()</b>.
    Click & drag to look around, <b>W, A, S, D</b> to walk.
  </p>

  <div class="controls">
    <div class="card">
      <label for="threadCount"><b>Worker Threads:</b> </label>
      <select id="threadCount"></select>
    </div>
    <div class="card">
      <label><input type="checkbox" id="showSlices"> Show Thread Slices Overlay</label>
    </div>
  </div>

  <canvas id="canvas" width="640" height="420"></canvas>

  <div class="stats-bar">
    <div>Samples: <span id="sampleStat" class="stat-val">0</span></div>
    <div>FPS: <span id="fpsStat" class="stat-val">0.0</span></div>
    <div>Throughput: <span id="rayStat" class="stat-val">0.0</span> MRays/s</div>
    <div>Speedup: <span id="speedupStat" class="speedup">1.0x</span></div>
  </div>

<script type="module">
import { wash_memory, wash_load, wash_worker } from "../../wash.js";

const canvas = document.querySelector("#canvas");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;

const threadSelect = document.querySelector("#threadCount");
const showSlicesBox = document.querySelector("#showSlices");
const sampleStat = document.querySelector("#sampleStat");
const fpsStat = document.querySelector("#fpsStat");
const rayStat = document.querySelector("#rayStat");
const speedupStat = document.querySelector("#speedupStat");

const MAX_THREADS = Math.max(1, navigator.hardwareConcurrency || 8);
for (let t = 1; t <= MAX_THREADS; t = (t === 1 ? 2 : t * 2)) {
    const opt = document.createElement("option");
    opt.value = t;
    opt.innerText = `${t} Threads ${t === MAX_THREADS ? "(Max Cores)" : ""}`;
    if (t === MAX_THREADS || (MAX_THREADS >= 8 && t === 8)) opt.selected = true;
    threadSelect.appendChild(opt);
}
if (![...threadSelect.options].some(o => parseInt(o.value) === MAX_THREADS)) {
    const opt = document.createElement("option");
    opt.value = MAX_THREADS;
    opt.innerText = `${MAX_THREADS} Threads (Max Cores)`;
    opt.selected = true;
    threadSelect.appendChild(opt);
}

// Memory layout: W*H*12 (accumulation) + W*H*4 (pixels) = ~4.3 MB
const ACC_SIZE = W * H * 12;
const PIXEL_SIZE = W * H * 4;
const TOTAL_SIZE = ACC_SIZE + PIXEL_SIZE;
const PIXEL_OFFSET = ACC_SIZE;

// 1. Create a memory buffer & load the shader module once
const mem = wash_memory(TOTAL_SIZE);
const shader = await wash_load("./main.wasm", mem);

// 2. Create explicit Wash Workers (one per available core)
const workers = Array.from({ length: MAX_THREADS }, () => wash_worker());

let numWorkers = parseInt(threadSelect.value);
threadSelect.addEventListener("change", () => {
    numWorkers = parseInt(threadSelect.value);
    frameCount = 0;
});

// Camera & interaction state
let camX = 0.0, camY = 0.5, camZ = 1.0;
let pitch = 0.0, yaw = Math.PI;
let frameCount = 0;
let isDragging = false;
const keys = { w: false, a: false, s: false, d: false };

canvas.addEventListener("mousedown", () => isDragging = true);
window.addEventListener("mouseup", () => isDragging = false);
window.addEventListener("mousemove", (e) => {
    if (!isDragging) return;
    yaw -= e.movementX * 0.005;
    pitch -= e.movementY * 0.005;
    if (pitch > 1.57) pitch = 1.57;
    if (pitch < -1.57) pitch = -1.57;
    frameCount = 0;
});

document.addEventListener("keydown", (e) => {
    if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true;
});
document.addEventListener("keyup", (e) => {
    if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false;
});

const imgData = ctx.createImageData(W, H);
let lastFpsTime = performance.now();
let framesRendered = 0;
let singleThreadThroughput = 0;
let isRendering = false;

async function renderLoop() {
    if (isRendering) return;
    isRendering = true;

    // Movement
    let moved = false;
    if (keys.w || keys.s || keys.a || keys.d) {
        moved = true;
        const speed = 0.06;
        const s = Math.sin(yaw), c = Math.cos(yaw);
        if (keys.w) { camX += -s * speed; camZ += c * speed; }
        if (keys.s) { camX -= -s * speed; camZ -= c * speed; }
        if (keys.d) { camX -= c * speed; camZ -= s * speed; }
        if (keys.a) { camX += c * speed; camZ += s * speed; }
        frameCount = 0;
    }

    const tStart = performance.now();
    const activeCount = Math.min(numWorkers, workers.length);
    const sliceHeight = Math.ceil(H / activeCount);

    // 3. Dispatch slices using worker.runSlice(...args) with typed arguments
    const promises = [];
    for (let i = 0; i < activeCount; i++) {
        const startY = i * sliceHeight;
        const endY = Math.min(H, (i + 1) * sliceHeight);
        const sliceByteLength = (endY - startY) * W * 4;
        const slicePixelOffset = PIXEL_OFFSET + (startY * W * 4);

        // Pass typed arguments straight to C _start(...) function:
        // _start(data, W, H, frameCount, camX, camY, camZ, pitch, yaw, startY, endY, threadId, totalThreads)
        const p = workers[i].runSlice(
            shader,
            slicePixelOffset,
            sliceByteLength,
            mem, // data pointer
            W, H, frameCount,
            camX, camY, camZ,
            pitch, yaw,
            startY, endY,
            i, activeCount
        ).then(res => {
            const sliceView = new Uint8Array(res.transferBuffer);
            imgData.data.set(sliceView, startY * W * 4);
        });

        promises.push(p);
    }

    await Promise.all(promises);

    const tEnd = performance.now();
    const frameDuration = tEnd - tStart;
    frameCount++;

    // Paint to canvas
    ctx.putImageData(imgData, 0, 0);

    // Optional debug visualizer of thread slices
    if (showSlicesBox.checked) {
        for (let i = 0; i < activeCount; i++) {
            const startY = i * sliceHeight;
            const endY = Math.min(H, (i + 1) * sliceHeight);
            ctx.strokeStyle = `hsl(${(i * 360) / activeCount}, 100%, 50%)`;
            ctx.lineWidth = 1;
            ctx.strokeRect(0, startY, W, endY - startY);
            ctx.fillStyle = `hsl(${(i * 360) / activeCount}, 100%, 75%)`;
            ctx.font = "12px monospace";
            ctx.fillText(`Thread #${i + 1} [Rows ${startY}-${endY}]`, 10, startY + 16);
        }
    }

    // Calculate metrics
    framesRendered++;
    const now = performance.now();
    if (now - lastFpsTime >= 500) {
        const fps = (framesRendered * 1000) / (now - lastFpsTime);
        const raysPerSec = ((W * H * 5) / (frameDuration / 1000.0)) / 1000000.0;

        fpsStat.innerText = fps.toFixed(1);
        rayStat.innerText = raysPerSec.toFixed(2);
        sampleStat.innerText = moved ? "Fast Preview" : frameCount;

        if (activeCount === 1) {
            singleThreadThroughput = raysPerSec;
            speedupStat.innerText = "1.0x (Baseline)";
        } else if (singleThreadThroughput > 0) {
            const speedup = raysPerSec / singleThreadThroughput;
            speedupStat.innerText = `${speedup.toFixed(1)}x`;
        } else {
            speedupStat.innerText = `${activeCount}.0x`;
        }

        framesRendered = 0;
        lastFpsTime = now;
    }

    isRendering = false;
    requestAnimationFrame(renderLoop);
}

requestAnimationFrame(renderLoop);
</script>
</body>
</html>
