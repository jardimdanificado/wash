<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wash API - Gradient</title>
<style>
  body { background: #222; color: white; font-family: sans-serif; text-align: center; }
  canvas { border: 1px solid #555; margin-top: 20px; }
</style>
</head>
<body>
  <h1>Example 1: Simple Gradient</h1>
  <p>Shows how to pass <b>W, H</b> directly as typed arguments with zero buffer unpacking boilerplate.</p>
  <canvas id="canvas" width="400" height="300"></canvas>

<script type="module">
import { wash_memory, wash_load, wash_run } from "../../wash.js";

const canvas = document.querySelector("#canvas");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;
const SIZE = W * H * 4;

// 1. Allocate pixel memory & load shader
const mem = wash_memory(SIZE);
const shader = await wash_load("./gradient.wasm", mem);

// 2. Execute shader passing typed arguments directly (pixels, width, height)
wash_run(shader, mem, W, H);

// 3. Extract pixels and output to canvas
const image = ctx.createImageData(W, H);
image.data.set(mem.u8);
ctx.putImageData(image, 0, 0);
</script>
</body>
</html>
