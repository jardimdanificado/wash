<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wash API - Imports</title>
<style>
  body { background: #222; color: white; font-family: sans-serif; text-align: center; }
  canvas { border: 1px solid #555; margin-top: 20px; }
</style>
</head>
<body>
  <h1>Example 2: JS <-> WASM Interaction</h1>
  <p>Shows how to pass JS functions (Math.random, console.log) to C through the Wash.js API.</p>
  <p><em>Open the DevTools (F12) to see the console.log() calls sent by C!</em></p>
  <canvas id="canvas" width="400" height="300"></canvas>

<script type="module">
import { wash_memory, wash_load, wash_run } from "../../wash.js";

const canvas = document.querySelector("#canvas");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;
const SIZE = 8 + W * H * 4;

// Injection object: functions for WebAssembly to invoke
const env = {
    console_log: (val) => console.log("C code just said: " + val),
    get_random: () => Math.random()
};

// 1. Allocate memory & load shader with imports
const mem = wash_memory(SIZE);
const shader = await wash_load("./imports.wasm", mem, { env });

mem.view.setUint32(0, W, true);
mem.view.setUint32(4, H, true);

// 2. Execute shader
wash_run(shader, mem);

const image = ctx.createImageData(W, H);
image.data.set(mem.rawU8(8, W * H * 4));
ctx.putImageData(image, 0, 0);
</script>
</body>
</html>
