<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Porffor REPL — JS → C</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
    display:flex;
    flex-direction:column;
    background:#111;
    color:#ddd;
    font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace
}
header{
    height:44px;
    display:flex;
    align-items:center;
    padding:0 14px;
    border-bottom:1px solid #2b2b2b;
    background:#151515;
}
.title{font-weight:600}
.status{margin-left:auto;color:#777;font-size:12px}
main{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:1fr 1fr;
}
.panel{
    min-width:0;
    min-height:0;
    display:flex;
    flex-direction:column;
}
.panel+ .panel{border-left:1px solid #2b2b2b}
.label{
    height:34px;
    display:flex;
    align-items:center;
    padding:0 12px;
    color:#888;
    border-bottom:1px solid #242424;
}
textarea{
    flex:1;
    width:100%;
    min-height:0;
    resize:none;
    border:0;
    outline:0;
    padding:14px;
    background:#101010;
    color:#ddd;
    font:inherit;
    line-height:1.5;
    tab-size:4;
}
#output{color:#c8c8c8}
footer{
    height:42px;
    display:flex;
    align-items:center;
    gap:8px;
    padding:0 10px;
    border-top:1px solid #2b2b2b;
    background:#151515;
}
button{
    border:1px solid #444;
    background:#222;
    color:#ddd;
    padding:6px 13px;
    font:inherit;
    cursor:pointer;
}
button:hover{background:#2b2b2b}
button:disabled{opacity:.45;cursor:default}
@media(max-width:700px){
    main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
    .panel+.panel{border-left:0;border-top:1px solid #2b2b2b}
}
</style>
</head>
<body>
<header>
    <span class="title">Porffor REPL</span>
    <span id="status" class="status">loading compiler…</span>
</header>

<main>
    <section class="panel">
        <div class="label">JavaScript</div>
        <textarea id="input" spellcheck="false">let x = 10;
console.log(x + 20);</textarea>
    </section>

    <section class="panel">
        <div class="label">C</div>
        <textarea id="output" readonly spellcheck="false"></textarea>
    </section>
</main>

<footer>
    <button id="run" disabled>Generate C</button>
    <button id="clear">Clear</button>
    <span style="margin-left:auto;color:#666">Ctrl+Enter</span>
</footer>

<script type="module">
import { compileToC } from "./porffor-bundle.js";

const input = document.querySelector("#input");
const output = document.querySelector("#output");
const run = document.querySelector("#run");
const clear = document.querySelector("#clear");
const status = document.querySelector("#status");

let ready = false;

async function generate() {
    if (!ready) return;

    run.disabled = true;
    status.textContent = "compiling…";

    try {
        output.value = await compileToC(input.value);
        status.textContent = "ready";
    } catch (error) {
        output.value =
            "/* Porffor compiler error */\n\n" +
            (error?.stack || String(error));
        status.textContent = "error";
    } finally {
        run.disabled = false;
    }
}

run.addEventListener("click", generate);

clear.addEventListener("click", () => {
    input.value = "";
    output.value = "";
    status.textContent = "ready";
    input.focus();
});

input.addEventListener("keydown", event => {
    if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
        event.preventDefault();
        generate();
    }

    if (event.key === "Tab") {
        event.preventDefault();

        const start = input.selectionStart;
        const end = input.selectionEnd;

        input.value =
            input.value.slice(0, start) +
            "    " +
            input.value.slice(end);

        input.selectionStart = input.selectionEnd = start + 4;
    }
});

try {
    // Force the compiler module to load before enabling the UI.
    await import("./porffor-bundle.js");
    ready = true;
    run.disabled = false;
    status.textContent = "ready";
} catch (error) {
    status.textContent = "compiler load error";
    output.value =
        "/* Failed to load Porffor */\n\n" +
        (error?.stack || String(error));
}
</script>
</body>
</html>
